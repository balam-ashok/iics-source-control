name: IDMC promote

# The one workflow that promotes IDMC assets Dev -> QA -> Prod. Each promotion is a pull request:
#
#   Dev branch --(tagged check-ins)--> QA branch --(tagged check-ins)--> Prod branch
#   (Dev org)                          (QA org)                          (Prod org)
#
# A check-in is promoted only when it carries an IDMC commit tag (Check In dialog > Commit Tag) that starts with
# the "ready" tag of its org: DEV_TAG_READY for a Dev check-in (e.g. ready-for-qa-crm-01), QA_TAG_READY for a QA
# check-in (e.g. ready-to-deploy-crm-01). Each commit tag must be unique, hence the suffix.
# Check-ins without such a tag start nothing in GitHub. A promotion shows as two runs in the Actions tab:
#
#   Run 1, on the tagged check-in (raise-pr):
#     - works out the promotion from the branch holding the commit: Dev branch -> QA, QA branch -> Prod
#     - takes the assets in that check-in, plus changed assets they use, that differ from the target branch
#     - copies just those files onto the promotion branch (promote/dev-to-qa or promote/qa-to-prod) and opens its PR;
#       while that PR is open, further tagged check-ins are added to it
#     - checks the connection / runtime environment names and sets the "validate" status on the PR
#   Approval: a normal PR review (branch protection on the target branch requires it).
#   Run 2, when the developer merges the approved PR (deploy):
#     - finds the assets they use (in Git) through the source org
#     - pulls the assets and those dependencies into the target org, renaming connections and runtime environments
#       on the way in (name variables), then publishes CAI assets
#     - tags the assets in the source org with the "done" tag and labels the PR
#   Connections, runtime environments and schedules are not created: they must already exist in each org.
#
# To re-raise a promotion for a commit tag that already exists: Actions > IDMC promote > Run workflow, enter the tag.
#
# Keep this file on all four branches (main, Dev, QA, Prod): a tagged check-in runs the copy on its branch, a merge
# runs the copy on the target branch, and a manual run uses the copy on the branch you pick.
#
# Nothing environment-specific is in this file. Settings > Secrets and variables > Actions:
#   Variables (Variables tab)
#     IICS_LOGIN_URL                          IDMC pod login URL, e.g. https://dmp-us.informaticacloud.com
#     DEV_BRANCH / QA_BRANCH / PROD_BRANCH    the three branch names
#     DEV_TAG_READY / QA_TAG_READY            commit tag prefix that promotes a Dev check-in to QA / a QA check-in to Prod
#     DEV_TAG_DONE                            IDMC tag set on the assets in the Dev org after the deploy to QA
#     QA_TAG_DONE                             IDMC tag set on the assets in the QA org after the deploy to Prod
#     Connection and runtime environment names, one variable per item per environment (<KEY> is any label you
#     choose, the same in all three; add as many as you need):
#       DEV_CONNECTION_<KEY> / QA_CONNECTION_<KEY> / PROD_CONNECTION_<KEY>   e.g. DEV_CONNECTION_SNOWFLAKE
#       DEV_RUNTIME_<KEY>    / QA_RUNTIME_<KEY>    / PROD_RUNTIME_<KEY>      e.g. DEV_RUNTIME_AGENT
#     The pull renames each Dev name to the target org's name (Git holds the Dev names).
#   Secrets (Secrets tab)
#     IICS_REPO                                GitHub token that may push the promotion branches and open PRs
#     DEV_IICS_USERNAME / DEV_IICS_PASSWORD    login for the Dev org
#     UAT_IICS_USERNAME / UAT_IICS_PASSWORD    login for the QA org
#     IICS_USERNAME / IICS_PASSWORD            login for the Prod org

on:
  push:
    tags: ['**']                   # only check-ins with a commit tag (the prefix is checked against the variables)
  pull_request:
    types: [closed]                # a merged promotion PR deploys
  workflow_dispatch:
    inputs:
      tag:
        description: Commit tag (or commit SHA) of the check-in to promote
        required: true

permissions:
  contents: read

env:
  IICS_LOGIN_URL: ${{ vars.IICS_LOGIN_URL }}
  DEV_BRANCH: ${{ vars.DEV_BRANCH }}
  QA_BRANCH: ${{ vars.QA_BRANCH }}
  PROD_BRANCH: ${{ vars.PROD_BRANCH }}
  DEV_TAG_READY: ${{ vars.DEV_TAG_READY }}
  DEV_TAG_DONE: ${{ vars.DEV_TAG_DONE }}
  QA_TAG_READY: ${{ vars.QA_TAG_READY }}
  QA_TAG_DONE: ${{ vars.QA_TAG_DONE }}
  # Shell helpers shared by the jobs below (each step loads them with: eval "$IDMC_FUNCTIONS")
  IDMC_FUNCTIONS: |
    # file names (stdin) -> IDMC assets, one per line: Explore/<project>/<folder>/<name>.<TYPE>
    norm_assets() {
      grep -viE '\.(project|folder)\.json$' \
        | sed -E 's#/\.([^/]+)$#/\1#; s/\.(vc\.json|zip|xml|json|dat)$//' | sort -u
    }
    # IDMC assets changed between two commits (changes on the second since they split)
    list_assets() {
      git -c core.quotePath=false diff --name-only --diff-filter=d "$1...$2" -- Explore | norm_assets
    }
    # idmc_login <user> <password>: sets $api (v3 base URL), $v2 (v2 base URL), $host and $session
    idmc_login() {
      local r base
      r=$(curl -sf -X POST "$IICS_LOGIN_URL/saas/public/core/v3/login" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg u "$1" --arg p "$2" '{username: $u, password: $p}')") \
        || { echo "::error::IDMC login failed"; return 1; }
      base=$(jq -r '.products[0].baseApiUrl' <<< "$r")
      api="$base/public/core/v3"; v2="$base/api/v2"; host=${base%/saas}; session=$(jq -r '.userInfo.sessionId' <<< "$r")
      echo "Logged in to IDMC org $(jq -r '.userInfo.orgName' <<< "$r")"
    }
    call() { curl -sf -H "INFA-SESSION-ID: $session" -H 'Accept: application/json' "$@"; }
    # wait_state <status URL>: polls a source control operation (pull) until it ends and prints its final state
    wait_state() {
      local s=""
      for _ in $(seq 180); do
        s=$(call "$1" | jq -r '.status.state' || true)
        case "$s" in SUCCESSFUL|SUCCESS|WARNING|FAILED|CANCELLED) break ;; esac
        sleep 10
      done
      echo "$s"
    }
    # name_map <QA|PROD> [<DEV|QA> <connections file> <runtime environments file>]
    # Reads the repository variables (ALL_VARS) DEV_CONNECTION_<KEY> / DEV_RUNTIME_<KEY> and the target's
    # <QA|PROD>_CONNECTION_<KEY> / <QA|PROD>_RUNTIME_<KEY>, and writes spec.json: the pull's objectSpecification renaming
    # each Dev name (and the source org's name, for assets checked in outside Dev) to the target name.
    # With the last three arguments (deploy), only the connections and runtime environments the assets actually use
    # are renamed: a name in the files matches a KEY by its Dev name or by its name in the source org (<DEV|QA>_...).
    # If no runtime environment could be detected, every configured runtime environment rename is kept.
    # Without them (PR check), every configured name is checked, and a missing one is only a warning (the PR check
    # can't see which connections the assets use). In the deploy, a missing name for a used item stops the deploy.
    name_map() {
      local filter=false
      if [ $# -ge 4 ]; then filter=true; fi
      jq --arg t "$1" --arg s "${2:-DEV}" --argjson filter "$filter" \
         --rawfile uc "${3:-/dev/null}" --rawfile ur "${4:-/dev/null}" '
        def trim: gsub("^\\s+|\\s+$"; "");
        def names($x): $x | split("\n") | map(trim | ascii_downcase) | map(select(length > 0));
        names($uc) as $usedc | names($ur) as $usedr
        | . as $v
        | [ to_entries[] | (.key | capture("^DEV_(?<kind>CONNECTION|RUNTIME)_(?<k>.+)$")) as $m
            | ($t + "_" + $m.kind + "_" + $m.k) as $tv
            | (.value | trim) as $from
            | (($v[$s + "_" + $m.kind + "_" + $m.k] // $from) | trim) as $srcname
            | (if $m.kind == "CONNECTION" then $usedc else $usedr end) as $used
            | {kind: $m.kind, from: $from, src: $srcname, var: $tv, to: (($v[$tv] // "") | trim),
               used: (($filter | not)
                      or ($m.kind == "RUNTIME" and ($usedr | length) == 0)
                      or ([$from, $srcname] | map(ascii_downcase) | any(.[]; . as $n | ($used | index($n)) != null)))} ]' \
        <<< "$ALL_VARS" > names.json
      { echo "### Connection and runtime environment names, Dev -> $1"
        if [ "$(jq length names.json)" = "0" ]; then echo "None configured (no DEV_CONNECTION_* / DEV_RUNTIME_* variables)"; fi
        jq -r '.[] | "- \(if .kind == "CONNECTION" then "Connection" else "Runtime environment" end): \(.from) -> \(if .to == "" then "MISSING (" + .var + ")" else .to end)\(if .used then "" else "  (not used by these assets, skipped)" end)"' names.json
      } | tee -a "$GITHUB_STEP_SUMMARY"
      if [ "$filter" = "true" ]; then
        # used connections / runtime environments that no name variable covers: they keep their name in the target
        local unknown
        unknown=$(jq -rn --slurpfile n names.json --rawfile uc "$3" --rawfile ur "$4" --arg s "$2" --argjson v "$ALL_VARS" '
          ($n[0] | map(.from | ascii_downcase)) as $known
          | ($v | to_entries | map(select(.key | startswith($s + "_CONNECTION_") or startswith($s + "_RUNTIME_")) | .value | ascii_downcase)) as $known_src
          | (($uc + "\n" + $ur) | split("\n") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)))
          | map(select((ascii_downcase) as $x | ($known + $known_src | index($x)) == null)) | unique | join(", ")')
        if [ -n "$unknown" ]; then
          echo "::warning::No name variables for: $unknown. They are pulled with the same name, so it must exist in the $1 org." | tee -a "$GITHUB_STEP_SUMMARY"
        fi
      fi
      local missing
      missing=$(jq -r '[.[] | select(.used and .to == "") | .var] | join(", ")' names.json)
      if [ -n "$missing" ]; then
        if [ "$filter" = "true" ]; then echo "::error::Set these repository variables (the names in the $1 org): $missing"; return 1; fi
        echo "::warning::Not set yet (needed only when an asset uses them): $missing"
      fi
      # Git normally holds the Dev name, but an asset checked in from another org (e.g. QA, before the Dev branch
      # existed) holds that org's name; offer both as sources. The pull ignores a source the assets don't contain.
      jq '[ .[] | select(.used and .to != "") | . as $e
            | (if .kind == "CONNECTION" then "Connection" else "AgentGroup" end) as $ty
            | ([$e.from, $e.src] | unique | map(select(. != $e.to)))[]
            | {source: {path: [.], type: $ty}, target: {path: [$e.to], type: $ty}} ] | unique' names.json > spec.json
    }
    # the type name Git uses for a type the IDMC APIs name differently
    gtype() {
      case "${1^^}" in
        MCT|MAPPING_TASK|MAPPINGTASK) echo MTT ;;   MAPPING) echo DTEMPLATE ;;
        SAAS_BSERVICES|SAAS_BSERVICE) echo BSERVICE ;; SYNCHRONIZATION_TASK) echo DSS ;;
        REPLICATION_TASK) echo DRS ;;               *) echo "${1^^}" ;;
      esac
    }
    # find_id <project/folder/name> <TYPE>: the object's id in the logged-in org
    find_id() {
      call -G "$api/objects" --data-urlencode "q=location=='${1%/*}'" --data-urlencode "limit=200" \
        | jq -r --arg p "$1" --arg t "$2" '
            def n: ascii_upcase | {MAPPING:"DTEMPLATE", MCT:"MTT", MAPPING_TASK:"MTT", SAAS_BSERVICES:"BSERVICE"}[.] // .;
            [.objects[] | select((.path | ltrimstr("/") | ltrimstr("Explore/")) == $p)] | (map(select((.type | n) == ($t | n))) + .)[0].id // empty'
    }
    # tagged_assets <tag>: the assets carrying that tag in the logged-in org, as Explore/<project>/<folder>/<name>.<TYPE>
    tagged_assets() {
      local skip=0 page n p t
      while :; do
        page=$(call -G "$api/objects" --data-urlencode "q=tag=='$1'" --data-urlencode "limit=200" --data-urlencode "skip=$skip") \
          || { echo "::error::Could not list the assets tagged $1 in IDMC" >&2; return 1; }
        while IFS=$'\t' read -r p t; do
          if [ -n "$p" ]; then echo "Explore/$p.$(gtype "$t")"; fi
        done < <(jq -r '.objects[]? | [((.path // "") | ltrimstr("/") | ltrimstr("Explore/")), (.type // "")] | @tsv' <<< "$page")
        n=$(jq '.objects | length' <<< "$page")
        if [ "$n" -lt 200 ]; then break; fi
        skip=$((skip + n))
      done
    }
    # walk_uses <assets file> <file names list>: follows "uses" from the assets in the logged-in org, up to 5 levels.
    # Writes deps.txt (used assets whose Explore/<path>.<TYPE>. is in the file names list), connections.txt and
    # runtimes.txt (names of the connections and runtime environments used).
    walk_uses() {
      local queue=() next seen=" " a p id rid rtype rpath t
      : > deps.txt; : > connections.txt; : > runtimes.txt
      while IFS= read -r a; do
        p=${a#Explore/}; id=$(find_id "${p%.*}" "${p##*.}")
        if [ -n "$id" ]; then queue+=("$id"); else echo "::warning::$p not found in the source org"; fi
      done < "$1"
      for _ in 1 2 3 4 5; do
        [ ${#queue[@]} -gt 0 ] || break
        next=()
        for id in "${queue[@]}"; do
          case "$seen" in *" $id "*) continue ;; esac
          seen="$seen$id "
          while IFS=$'\t' read -r rid rtype rpath; do
            [ -n "$rid" ] || continue
            t=$(gtype "$rtype")
            if [[ "$t" == *CONNECTION* && "$t" != AI_* ]]; then
              echo "${rpath##*/}" >> connections.txt
            elif [[ "$t" == *AGENT* || "$t" == *RUNTIME* ]]; then
              echo "${rpath##*/}" >> runtimes.txt
            elif grep -Fqi "Explore/$rpath.$t." "$2"; then
              echo "Explore/$rpath.$t" >> deps.txt; next+=("$rid")
            fi
          done < <(call -G "$api/objects/$id/references" --data-urlencode "refType=Uses" --data-urlencode "limit=50" \
            | jq -r '.references[]? | [.id, (.documentType // .type // ""),
                ((.path // "") | (if type == "array" then join("/") else . end) | ltrimstr("/") | ltrimstr("Explore/")) as $p
                | (.name // "") as $n
                | (if $n != "" and ($p | split("/") | last) != $n then ($p + "/" + $n | ltrimstr("/")) else $p end)] | @tsv')
        done
        queue=("${next[@]}")
      done
      sort -u -o deps.txt deps.txt
      sort -u -o connections.txt connections.txt
      sort -u -o runtimes.txt runtimes.txt
    }
    # retag <assets file> <tag to remove or ""> <tag to add>: changes the IDMC tags in the logged-in org
    retag() {
      local asset path id ids=()
      while IFS= read -r asset; do
        path=${asset#Explore/}
        id=$(find_id "${path%.*}" "${path##*.}")
        if [ -n "$id" ]; then ids+=("$id"); else echo "::warning::${path} not found in the source org, not tagged"; fi
      done < "$1"
      [ ${#ids[@]} -gt 0 ] || return 0
      if [ -n "$2" ]; then
        printf '%s\n' "${ids[@]}" | jq -R . | jq -s --arg t "$2" 'map({id: ., tags: [$t]})' \
          | call -X POST "$api/UntagObjects" -H 'Content-Type: application/json' -d @- > /dev/null || true
      fi
      printf '%s\n' "${ids[@]}" | jq -R . | jq -s --arg t "$3" 'map({id: ., tags: [$t]})' \
        | call -X POST "$api/TagObjects" -H 'Content-Type: application/json' -d @- > /dev/null \
        || echo "::warning::Could not add the tag $3 in the source org"
      echo "Tagged ${#ids[@]} asset(s) $3 in the source org"
    }

jobs:
  # 0. Which promotion is this event part of? The other jobs read its outputs.
  route:
    runs-on: ubuntu-latest
    outputs:
      hop: ${{ steps.r.outputs.hop }}
      sha: ${{ steps.r.outputs.sha }}
      ref: ${{ steps.r.outputs.ref }}
      src_branch: ${{ steps.r.outputs.src_branch }}
      dst_branch: ${{ steps.r.outputs.dst_branch }}
      promo_branch: ${{ steps.r.outputs.promo_branch }}
      src_name: ${{ steps.r.outputs.src_name }}
      dst_name: ${{ steps.r.outputs.dst_name }}
      src_secret: ${{ steps.r.outputs.src_secret }}
      dst_secret: ${{ steps.r.outputs.dst_secret }}
      tag_done: ${{ steps.r.outputs.tag_done }}
      deployed_label: ${{ steps.r.outputs.deployed_label }}
      environment: ${{ steps.r.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0

      - name: Work out the promotion (Dev -> QA or QA -> Prod)
        id: r
        env:
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          MERGED: ${{ github.event.pull_request.merged }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          # every setting must be filled in under Settings > Secrets and variables > Actions > Variables
          missing=""
          for v in IICS_LOGIN_URL DEV_BRANCH QA_BRANCH PROD_BRANCH DEV_TAG_READY DEV_TAG_DONE QA_TAG_READY QA_TAG_DONE; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Repository variables not set:$missing"; exit 1; fi

          hop=""; sha=""; ref=""
          if [ "$EVENT" = "pull_request" ]; then
            # a merged PR counts only from a promotion branch of this repository into the next branch
            if [ "$MERGED" = "true" ] && [ "$PR_HEAD_REPO" = "$REPO" ]; then
              if [ "$PR_HEAD" = "promote/dev-to-qa" ] && [ "$PR_BASE" = "$QA_BRANCH" ]; then hop=dev-qa; fi
              if [ "$PR_HEAD" = "promote/qa-to-prod" ] && [ "$PR_BASE" = "$PROD_BRANCH" ]; then hop=qa-prod; fi
            fi
          else
            # a tagged check-in: the branch holding the commit decides the promotion
            if [ "$EVENT" = "push" ]; then ref=$PUSHED_TAG; else ref=$(echo "$INPUT_TAG" | xargs); fi
            sha=$(git rev-parse -q --verify "$ref^{commit}" || git rev-parse -q --verify "origin/$ref^{commit}" || true)
            if [ -z "$sha" ]; then echo "::error::$ref is not a commit tag or commit in this repository"; exit 1; fi
            on_branch() { git merge-base --is-ancestor "$sha" "origin/$1"; }
            if on_branch "$DEV_BRANCH" && on_branch "$QA_BRANCH"; then
              echo "::error::Commit $sha ($ref) is on both $DEV_BRANCH and $QA_BRANCH, so the promotion is unclear"; exit 1
            elif on_branch "$DEV_BRANCH"; then hop=dev-qa; ready=$DEV_TAG_READY
            elif on_branch "$QA_BRANCH"; then hop=qa-prod; ready=$QA_TAG_READY
            fi
            # a commit tag promotes only when it starts with the "ready" tag of that org (a manual run always does)
            if [ "$EVENT" = "push" ] && [ -n "$hop" ] && [[ "$ref" != "$ready"* ]]; then
              echo "::notice::Commit tag $ref does not start with $ready, so it is not a promotion"
              hop=""
            fi
          fi
          case "$hop" in
            dev-qa)
              set -- "$DEV_BRANCH" "$QA_BRANCH" "Dev" "QA" DEV_IICS UAT_IICS "$DEV_TAG_DONE" "Deployed to QA" qa promote/dev-to-qa ;;
            qa-prod)
              set -- "$QA_BRANCH" "$PROD_BRANCH" "QA" "Prod" UAT_IICS IICS "$QA_TAG_DONE" "Deployed to Prod" production promote/qa-to-prod ;;
            *)
              echo "Not part of a promotion (${ref:-this PR}); nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "hop=" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          {
            echo "hop=$hop"; echo "sha=$sha"; echo "ref=$ref"
            echo "src_branch=$1"; echo "dst_branch=$2"; echo "src_name=$3"; echo "dst_name=$4"
            echo "src_secret=$5"; echo "dst_secret=$6"; echo "tag_done=$7"
            echo "deployed_label=$8"; echo "environment=$9"; echo "promo_branch=${10}"
          } >> "$GITHUB_OUTPUT"
          echo "Promotion: $3 -> $4 ($1 -> $2)${ref:+, check-in $ref}" | tee -a "$GITHUB_STEP_SUMMARY"

  # 1. Tagged check-in: put its assets on the promotion branch, raise (or update) the PR and set "validate".
  #    Never merges anything.
  raise-pr:
    needs: route
    if: github.event_name != 'pull_request' && needs.route.outputs.hop != ''
    runs-on: ubuntu-latest
    concurrency:
      group: idmc-raise-pr-${{ needs.route.outputs.hop }}
      cancel-in-progress: false
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ secrets.IICS_REPO }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.route.outputs.sha }}
      REF: ${{ needs.route.outputs.ref }}
      HOP: ${{ needs.route.outputs.hop }}
      SRC: ${{ needs.route.outputs.src_branch }}
      DST: ${{ needs.route.outputs.dst_branch }}
      PROMO: ${{ needs.route.outputs.promo_branch }}
      SRC_NAME: ${{ needs.route.outputs.src_name }}
      DST_NAME: ${{ needs.route.outputs.dst_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.IICS_REPO }}
          fetch-depth: 0

      - name: Find the assets in the tagged check-in
        id: pick
        env:
          SRC_USER: ${{ secrets[format('{0}_USERNAME', needs.route.outputs.src_secret)] }}
          SRC_PASS: ${{ secrets[format('{0}_PASSWORD', needs.route.outputs.src_secret)] }}
        run: |
          eval "$IDMC_FUNCTIONS"
          # the assets this check-in changed, and those whose version here differs from the target branch
          git -c core.quotePath=false diff --name-only --diff-filter=d "$SHA^" "$SHA" -- Explore | norm_assets > commit.txt || true
          git -c core.quotePath=false diff --name-only --diff-filter=d "origin/$DST" "$SHA" -- Explore | norm_assets > changed.txt || true
          awk 'NR == FNR { c[$0] = 1; next } $0 in c' changed.txt commit.txt > selected.txt
          if [ ! -s selected.txt ]; then
            if [ -s commit.txt ]; then echo "The assets in $REF are already the same on $DST; no PR." | tee -a "$GITHUB_STEP_SUMMARY"
            else echo "$REF has no IDMC assets; no PR." | tee -a "$GITHUB_STEP_SUMMARY"; fi
            echo "count=0" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # add the changed assets they use (connections and runtime environments are not in Git)
          idmc_login "$SRC_USER" "$SRC_PASS"
          sed 's/$/./' changed.txt > changed_prefix.txt
          walk_uses selected.txt changed_prefix.txt
          awk 'NR == FNR { t[tolower($0)] = 1; next } tolower($0) in t' <(cat selected.txt deps.txt) changed.txt > promote.txt
          awk 'NR == FNR { s[$0] = 1; next } !($0 in s)' selected.txt promote.txt > used.txt
          { echo "### Check-in $REF ($SRC_NAME)"; sed 's/^Explore\//- /' selected.txt
            if [ -s used.txt ]; then echo "### Used by them (also promoted)"; sed 's/^Explore\//- /' used.txt; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "count=$(wc -l < promote.txt)" >> "$GITHUB_OUTPUT"

      - name: Add them to the promotion branch and open or update its PR
        id: pr
        if: steps.pick.outputs.count != '0'
        run: |
          eval "$IDMC_FUNCTIONS"
          # the files of each asset (normal and hidden metadata) and of the projects / folders holding them
          git -c core.quotePath=false ls-tree -r --name-only "$SHA" -- Explore > srcfiles.txt
          : > files.txt
          while IFS= read -r k; do
            d=${k%/*}; b=${k##*/}
            awk -v a="$d/$b." -v h="$d/.$b." 'index($0, a) == 1 || index($0, h) == 1' srcfiles.txt >> files.txt
            acc=Explore
            IFS=/ read -ra parts <<< "${d#Explore/}"
            for part in "${parts[@]}"; do
              acc="$acc/$part"
              awk -v a="$acc/$part." -v h="$acc/.$part." \
                '(index($0, a) == 1 || index($0, h) == 1) && tolower($0) ~ /\.(project|folder)\.json$/' srcfiles.txt >> files.txt
            done
          done < promote.txt
          sort -u -o files.txt files.txt

          # an open PR collects further tagged check-ins; otherwise start again from the target branch
          pr=$(gh pr list --base "$DST" --head "$PROMO" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ] && git rev-parse -q --verify "origin/$PROMO" > /dev/null; then base="origin/$PROMO"; else base="origin/$DST"; fi
          git checkout -q -B "$PROMO" "$base"
          git --literal-pathspecs restore --source="$SHA" --staged --worktree --pathspec-from-file=files.txt
          if git diff --cached --quiet; then
            echo "$PROMO already has these versions."
            if [ -z "$pr" ]; then exit 0; fi
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Promote $REF: $SRC_NAME to $DST_NAME" -m "$(sed 's/^Explore\//- /' promote.txt)"
            if [ "$base" = "origin/$PROMO" ]; then git push origin "HEAD:refs/heads/$PROMO"
            else git push --force origin "HEAD:refs/heads/$PROMO"; fi
          fi

          list_assets "origin/$DST" HEAD > inpr.txt || true
          { echo "IDMC assets from tagged check-ins on $SRC_NAME, raised by the IDMC promote workflow (latest: \`$REF\`)."
            echo; echo "**Assets in this promotion**"; sed 's/^Explore\//- /' inpr.txt
            echo; echo "Approve this PR, then merge it to deploy these assets to $DST_NAME."
          } > body.md
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file body.md
            echo "Added to the $SRC_NAME -> $DST_NAME PR #$pr" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base "$DST" --head "$PROMO" --title "Promote IDMC assets: $SRC_NAME to $DST_NAME" --body-file body.md \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the connection and runtime environment names for the target org
        if: steps.pr.outputs.head != ''
        env:
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          eval "$IDMC_FUNCTIONS"
          name_map "$([ "$HOP" = "dev-qa" ] && echo QA || echo PROD)"

      - name: Set the "validate" status on the PR
        if: steps.pr.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GH_REPO/statuses/$HEAD_SHA" -f state=success -f context=validate \
            -f description="IDMC assets listed and names checked" -f target_url="$RUN_URL" > /dev/null

  # 2. On the developer's merge of an approved promotion PR: deploy to the target org and tag in the source org.
  deploy:
    needs: route
    if: github.event_name == 'pull_request' && needs.route.outputs.hop != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.route.outputs.environment }}   # deployment history per target; add protection rules here if needed
    concurrency:
      group: idmc-deploy-${{ needs.route.outputs.hop }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      SRC_NAME: ${{ needs.route.outputs.src_name }}
      DST_NAME: ${{ needs.route.outputs.dst_name }}
      TAG_DONE: ${{ needs.route.outputs.tag_done }}
      DEPLOYED_LABEL: ${{ needs.route.outputs.deployed_label }}
      HOP: ${{ needs.route.outputs.hop }}
      ALL_VARS: ${{ toJSON(vars) }}
      SRC_USER: ${{ secrets[format('{0}_USERNAME', needs.route.outputs.src_secret)] }}
      SRC_PASS: ${{ secrets[format('{0}_PASSWORD', needs.route.outputs.src_secret)] }}
      DST_USER: ${{ secrets[format('{0}_USERNAME', needs.route.outputs.dst_secret)] }}
      DST_PASS: ${{ secrets[format('{0}_PASSWORD', needs.route.outputs.dst_secret)] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only deploy a PR that was approved
        run: |
          decision=$(gh pr view "$PR" --json reviewDecision --jq .reviewDecision)
          if [ "$decision" != "APPROVED" ]; then echo "::error::PR #$PR was merged without approval; not deploying."; exit 1; fi
          echo "Deploying $SRC_NAME -> $DST_NAME" | tee -a "$GITHUB_STEP_SUMMARY"

      # all.txt: the assets plus the assets they use that are in Git. Connections and runtime environments are
      # not in Git: they must already exist in the target org (named as in the mapping variables).
      - name: Find what the assets use in the source org
        run: |
          eval "$IDMC_FUNCTIONS"
          : > all.txt; : > deps.txt; : > connections.txt; : > runtimes.txt
          list_assets "$BASE" "$HEAD" > assets.txt || true
          if [ ! -s assets.txt ]; then echo "No IDMC assets to deploy."; exit 0; fi
          git -c core.quotePath=false ls-tree -r --name-only "$MERGE_SHA" -- Explore > gitfiles.txt
          idmc_login "$SRC_USER" "$SRC_PASS"
          walk_uses assets.txt gitfiles.txt
          sort -u assets.txt deps.txt > all.txt

          { echo "### To deploy"; sed 's/^Explore\//- /' all.txt
            echo "### Connections the assets use in $SRC_NAME (must exist in $DST_NAME, after mapping)"
            if [ -s connections.txt ]; then sed 's/^/- /' connections.txt; else echo "None found"; fi
            echo "### Runtime environments the assets use in $SRC_NAME"
            if [ -s runtimes.txt ]; then sed 's/^/- /' runtimes.txt; else echo "None detected"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pull the assets into the target org and publish
        run: |
          eval "$IDMC_FUNCTIONS"
          [ -s all.txt ] || exit 0
          # the project and folders holding them (a pull does not create missing ones), then the assets,
          # all at the merge commit on the target branch
          {
            while IFS= read -r asset; do
              dir=${asset#Explore/}; dir=${dir%/*}; acc=""; kind=Project
              IFS=/ read -ra parts <<< "$dir"
              for part in "${parts[@]}"; do
                acc=${acc:+$acc/}$part
                if grep -Fqx "Explore/$acc/$part.$kind.json" gitfiles.txt; then echo "$acc|$kind"; fi
                kind=Folder
              done
            done < all.txt | awk '!seen[$0]++'
            sed -E 's#^Explore/##; s#\.([^.]+)$#|\1#' all.txt
          } > pull.txt
          # rename the connections and runtime environments these assets use (Dev name -> target name)
          if [ "$HOP" = "dev-qa" ]; then name_map QA DEV connections.txt runtimes.txt
          else name_map PROD QA connections.txt runtimes.txt; fi
          body=$(jq -R 'split("|") | {path: (.[0] | split("/")), type: .[1]}' pull.txt \
                 | jq -s --arg c "$MERGE_SHA" --slurpfile spec spec.json \
                     '{commitHash: $c, objects: .} + (if ($spec[0] | length) > 0
                        then {objectSpecification: $spec[0], relaxObjectSpecificationValidation: true} else {} end)')

          idmc_login "$DST_USER" "$DST_PASS"
          resp=$(curl -s -X POST "$api/pull" -H "INFA-SESSION-ID: $session" -H 'Content-Type: application/json' -d "$body")
          action=$(jq -r '.pullActionId // empty' <<< "$resp" 2> /dev/null || true)
          if [ -z "$action" ]; then echo "::error::IDMC did not start the pull: $resp"; exit 1; fi
          state=$(wait_state "$api/sourceControlAction/$action")
          status=$(call "$api/sourceControlAction/$action?expand=objects")
          { echo "### Pull into $DST_NAME: $state"
            jq -r '.objects[]? | "- \(.target.status.state // .status.state) \(.target.type // .source.type) \((.target.path // .source.path) | if type == "array" then join("/") else . end) \(.target.status.message // .status.message // "")"' <<< "$status"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$state" != "SUCCESSFUL" ]; then
            echo "::error::Pull into $DST_NAME ended $state: $(jq -r '.status.message // ""' <<< "$status")"; exit 1
          fi

          # CAI assets and taskflows have to be published after the pull (connections first)
          paths=$(for t in AI_CONNECTION AI_SERVICE_CONNECTOR PROCESS GUIDE TASKFLOW; do
                    { grep -i "\.$t$" all.txt || true; } | while IFS= read -r a; do
                      if grep -Fqx "$a.xml" gitfiles.txt; then echo "$a.xml"; fi
                    done
                  done)
          if [ -n "$paths" ]; then
            if jq -Rn '[inputs] | {data: {type: "publish", attributes: {assetPaths: .}}}' <<< "$paths" \
                 | curl -sf -X POST "$host/active-bpel/asset/v1/publish" -H "INFA-SESSION-ID: $session" \
                     -H 'Accept: application/vnd.api+json' -H 'Content-Type: application/vnd.api+json' -d @- > /dev/null; then
              echo "Publish submitted for: $paths"
            else
              echo "::warning::Publish failed; publish these in $DST_NAME by hand: $paths"
            fi
          fi

      - name: Tag the assets in the source org
        run: |
          eval "$IDMC_FUNCTIONS"
          [ -s all.txt ] || exit 0
          idmc_login "$SRC_USER" "$SRC_PASS"
          retag all.txt "" "$TAG_DONE"

      - name: Label the PR and report back
        if: always()
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then
            gh label create "$DEPLOYED_LABEL" --color 1D76DB --force
            gh pr edit "$PR" --add-label "$DEPLOYED_LABEL" || true
            echo "@$AUTHOR deployed to $DST_NAME and tagged **$TAG_DONE** in $SRC_NAME. Details: $RUN_URL" > comment.md
          else
            echo "@$AUTHOR the deployment to $DST_NAME **failed**; fix the cause, then use Re-run failed jobs on $RUN_URL" > comment.md
          fi
          gh pr comment "$PR" --body-file comment.md

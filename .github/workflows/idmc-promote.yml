name: IDMC promote

# =====================================================================================================================
# IDMC promote: validate a release PR, and deploy it when merged (Dev -> Test -> Prod through pull requests)
#
#   development ──release/vX.Y.Z-to-tst──> testing ──release/vX.Y.Z-to-prd──> main      one Git branch per IDMC org
#   (Dev org)                              (Test org)                         (Prod org)
#
# The release branch and PR are raised by idmc-build-check.yml. Both jobs run in the target org's environment (TST or
# PRD), which also holds the source org's login (SRC_IICS_*):
#   validate   the release PR's required check: each connection / runtime environment the assets in Git use exists in
#              the target org, under its name there (see the naming convention below), and each asset the release
#              uses (found in the source org) is in Git (pulled with it) or already in the target org. GITHUB_TOKEN
#              pushes fire no workflow, so the build check starts it by hand on the release branch; a push by a
#              person runs it too.
#   deploy     on the push a merged release PR makes to testing / main (merged by hand, after an approval): checks the
#              names and used assets again, lists the PR's assets + the assets they use (source org), pulls them into the target org at
#              the merge commit (names mapped), publishes CAI assets, swaps the ready tag for the done tag (source
#              org), creates the Git tag (vX.Y.Z-tst on testing, vX.Y.Z on main), then labels the PR and comments.
#   Into testing: source Dev, target TST. Into main: source Test, target PRD. Other merges deploy nothing.
#   Connections, runtime environments and schedules are not created: they must already exist in each org.
#
# Naming convention: connection / runtime environment names carry the GitHub environment name as an _-separated part,
# e.g. CONN_DEV_WMI_SNOWFLAKE_MDM -> CONN_TST_... -> CONN_PRD_..., SAG_Dev_Azure_windows01 -> SAG_Tst_... (case kept).
# Git always holds the Dev names; a name with no DEV part is pulled unchanged.
#
# Keep this file, idmc-build-check.yml and .github/scripts/idmc-functions.sh identical on main, testing and development
# (validate runs the copy on the release branch, which starts from the target branch).
#
# Settings > Environments DEV, TST and PRD, the same names in each:
#   variables  IICS_USERNAME                      the org's service user
#              TAG_READY / TAG_DONE               marks an asset for promotion / set after the deploy
#              SRC_IICS_USERNAME                  TST and PRD: the source org's service user (TST: Dev's, PRD: Test's)
#   secrets    IICS_PASSWORD                      the service user's password
#              SRC_IICS_PASSWORD                  TST and PRD: the source org's service user's password
#   Deployment branches: TST testing and release/*-to-tst; PRD main and release/*-to-prd.
#   PRD keeps required reviewers: the jobs that use it (validate for Prod, deploy to Prod) wait for an approval.
# Repository variable IICS_LOGIN_URL: IDMC pod login URL, e.g. https://dmp-us.informaticacloud.com
# Branch rules on testing and main: require an approval and the "validate" check.
# =====================================================================================================================

on:
  push:
    branches: [testing, main, 'release/**']
  workflow_dispatch:                       # validate on a release branch, started by the build check

permissions:
  contents: read

env:
  IICS_LOGIN_URL: ${{ vars.IICS_LOGIN_URL }}

jobs:
  # Target org: Prod for main or a release/*-to-prd branch, otherwise Test.
  validate:
    name: validate
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.ref_name, 'release/') && !github.event.deleted)
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'main' || endsWith(github.ref_name, '-to-prd')) && 'PRD' || 'TST' }}
    env:
      TARGET_ENV: ${{ (github.ref_name == 'main' || endsWith(github.ref_name, '-to-prd')) && 'PRD' || 'TST' }}
      BASE_BRANCH: ${{ endsWith(github.ref_name, '-to-prd') && 'main' || 'testing' }}
      IICS_USERNAME: ${{ vars.IICS_USERNAME }}
      IICS_PASSWORD: ${{ secrets.IICS_PASSWORD }}
      SRC_IICS_USERNAME: ${{ vars.SRC_IICS_USERNAME }}
      SRC_IICS_PASSWORD: ${{ secrets.SRC_IICS_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # On a release branch also: each asset the release uses (source org) is in Git or already in the target org.
      - name: Check the target org has what the assets use
        run: |
          source .github/scripts/idmc-functions.sh
          require IICS_LOGIN_URL IICS_USERNAME IICS_PASSWORD
          name_map "$TARGET_ENV"
          : > assets.txt
          if [[ "$GITHUB_REF_NAME" == release/* ]]; then
            require SRC_IICS_USERNAME SRC_IICS_PASSWORD
            list_assets "origin/$BASE_BRANCH" HEAD > assets.txt || true
            git -c core.quotePath=false ls-tree -r --name-only HEAD -- Explore > gitfiles.txt
            if [ -s assets.txt ]; then
              idmc_login "$SRC_IICS_USERNAME" "$SRC_IICS_PASSWORD"
              walk_uses assets.txt gitfiles.txt
            fi
          fi
          idmc_login "$IICS_USERNAME" "$IICS_PASSWORD"
          rc=0
          check_target_names "$TARGET_ENV" || rc=1
          if [ -s assets.txt ]; then check_target_assets "$TARGET_ENV" || rc=1; fi
          exit $rc

  # ===================================================================================================================
  # find-release: the release PR this push to testing / main merged, if any (no environment: no approval asked)
  # ===================================================================================================================
  find-release:
    name: Find the merged release PR
    if: github.event_name == 'push' && (github.ref_name == 'testing' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.r.outputs.pr }}
      version: ${{ steps.r.outputs.version }}
      author: ${{ steps.r.outputs.author }}
    steps:
      - name: Find the release PR merged by this push
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          STAGE: ${{ github.ref_name == 'main' && 'prd' || 'tst' }}
        run: |
          gh api "repos/$GH_REPO/commits/$SHA/pulls" > prs.json
          out=$(jq -r --arg sha "$SHA" --arg repo "$GH_REPO" --arg b "$BRANCH" \
                  --arg re "^release/(?<v>v[0-9]+\\.[0-9]+\\.[0-9]+)-to-$STAGE\$" '
            [.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == $b
                          and .head.repo.full_name == $repo and (.head.ref | test($re)))][0] // empty
            | "pr=\(.number)", "version=\(.head.ref | capture($re).v)", "author=\(.user.login)"' prs.json)
          if [ -z "$out" ]; then echo "Not the merge of a release PR into $BRANCH; nothing to deploy."; exit 0; fi
          echo "$out" | tee -a "$GITHUB_OUTPUT"

  # ===================================================================================================================
  # deploy: a merged release PR. Source / target org from the pushed branch.
  # ===================================================================================================================
  deploy:
    name: Deploy to the target org
    needs: find-release
    if: needs.find-release.outputs.pr != ''
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'PRD' || 'TST' }}
    concurrency:
      group: idmc-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE: ${{ github.event.before }}
      HEAD: ${{ github.sha }}
      MERGE_SHA: ${{ github.sha }}
      SRC_NAME: ${{ github.ref_name == 'main' && 'Test' || 'Dev' }}
      DST_NAME: ${{ github.ref_name == 'main' && 'Prod' || 'Test' }}
      DST_ENV: ${{ github.ref_name == 'main' && 'PRD' || 'TST' }}
      RELEASE_TAG: ${{ needs.find-release.outputs.version }}${{ github.ref_name != 'main' && '-tst' || '' }}
      TAG_READY: ${{ vars.TAG_READY }}
      TAG_DONE: ${{ vars.TAG_DONE }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the connections and runtime environments exist in the target org
        env:
          IICS_USERNAME: ${{ vars.IICS_USERNAME }}
          IICS_PASSWORD: ${{ secrets.IICS_PASSWORD }}
        run: |
          source .github/scripts/idmc-functions.sh
          require IICS_LOGIN_URL IICS_USERNAME IICS_PASSWORD TAG_READY TAG_DONE
          name_map "$DST_ENV"
          idmc_login "$IICS_USERNAME" "$IICS_PASSWORD"
          check_target_names "$DST_ENV"

      - name: Find the assets and their dependencies in the source org
        env:
          SRC_IICS_USERNAME: ${{ vars.SRC_IICS_USERNAME }}
          SRC_IICS_PASSWORD: ${{ secrets.SRC_IICS_PASSWORD }}
        run: |
          source .github/scripts/idmc-functions.sh
          require SRC_IICS_USERNAME SRC_IICS_PASSWORD
          deploy_find_deps

      - name: Pull into the target org and publish
        env:
          IICS_USERNAME: ${{ vars.IICS_USERNAME }}
          IICS_PASSWORD: ${{ secrets.IICS_PASSWORD }}
        run: |
          source .github/scripts/idmc-functions.sh
          deploy_pull

      - name: Create the Git tag
        run: |
          source .github/scripts/idmc-functions.sh
          deploy_git_tag

      - name: Re-tag in the source org (ready -> done)
        env:
          SRC_IICS_USERNAME: ${{ vars.SRC_IICS_USERNAME }}
          SRC_IICS_PASSWORD: ${{ secrets.SRC_IICS_PASSWORD }}
        run: |
          source .github/scripts/idmc-functions.sh
          deploy_retag

      - name: Label the PR and report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.find-release.outputs.pr }}
          AUTHOR: ${{ needs.find-release.outputs.author }}
          DEPLOYED_LABEL: ${{ github.ref_name == 'main' && 'Deployed to Prod' || 'Deployed to Test' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ job.status }}
        run: |
          source .github/scripts/idmc-functions.sh
          deploy_report

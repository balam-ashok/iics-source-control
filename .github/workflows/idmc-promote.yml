name: IDMC promote

# The only workflow for promoting IDMC assets from QA to Production. Branches and orgs: cicd/config.yml.
#
#   QA branch (Demo-Central-Branch)  --PR-->  Production branch (Dfactory-Branch)
#
#   1. open-promotion-pr         A check-in to the QA branch opens the promotion PR (or reuses the open one).
#   2. validate-promotion        Runs on the PR. It is a required status check: if it fails, the PR cannot
#                                be merged and nothing is packaged.
#   3. Human approval            Native PR review. Branch protection on the Production branch requires an
#                                approval from CODEOWNERS (.github/CODEOWNERS) and the passing check.
#   4. prepare-manual-migration  Only after approval: exports the package from the QA org, attaches it to
#                                the run with the asset list, tags the approved commit, labels the PR
#                                "Ready to Deploy" and notifies the developer.
#
# No job logs in to the Production org or calls an import, pull or deploy API. The developer migrates
# Production by hand from the package. Connections and schedules are not promoted: validation fails if
# the package contains any.
#
# This file must be on the QA branch as well as main: push events use the copy on the pushed branch, and
# PR events use the PR's copy. The scripts and config always come from main.

on:
  push:
    branches: [Demo-Central-Branch]            # QA branch: every IDMC check-in
  pull_request:
    branches: [Dfactory-Branch]                # Production branch
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:                           # re-open the PR by hand if needed

permissions:
  contents: read

concurrency:
  group: idmc-promote-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  QA_BRANCH: Demo-Central-Branch
  PROD_BRANCH: Dfactory-Branch
  READY_LABEL: Ready to Deploy

jobs:
  # ------------------------------------------------------------------------------------------------
  # Stage 1: raise the promotion PR. It is opened with the IICS_REPO token (a PAT): a PR opened with
  # GITHUB_TOKEN would not start the checks in stage 2. This job never merges anything.
  # ------------------------------------------------------------------------------------------------
  open-promotion-pr:
    name: open-promotion-pr
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Open the promotion PR, or reuse the open one
        env:
          GH_TOKEN: ${{ secrets.IICS_REPO }}
          GH_REPO: ${{ github.repository }}
        run: |
          ahead=$(gh api "repos/$GH_REPO/compare/$PROD_BRANCH...$QA_BRANCH" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "Nothing to promote: $PROD_BRANCH already has every commit on $QA_BRANCH." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pr=$(gh pr list --base "$PROD_BRANCH" --head "$QA_BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            url=$(gh pr create --base "$PROD_BRANCH" --head "$QA_BRANCH" \
              --title "Promote IDMC assets: QA to Production" \
              --body "Promotion PR raised by the IDMC promote workflow. The validate-promotion check lists the assets in this promotion. Once it passes and a code owner approves, the package for manual migration is attached to the run and this PR is labelled \"$READY_LABEL\". Nothing is deployed to Production automatically.")
            echo "Opened the promotion PR: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh pr view "$pr" --json url --jq '.url')
            echo "The promotion PR is already open and now includes this check-in: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # ------------------------------------------------------------------------------------------------
  # Stage 2: validation checks. Runs on every PR update, and again when a reviewer approves, so the
  # package is always built from a freshly checked commit. Make "validate-promotion" a required status
  # check on the Production branch so a failure blocks the PR.
  # ------------------------------------------------------------------------------------------------
  validate-promotion:
    name: validate-promotion
    if: >-
      (github.event_name == 'pull_request' ||
       (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')) &&
      github.event.pull_request.base.ref == 'Dfactory-Branch' &&
      github.event.pull_request.head.ref == 'Demo-Central-Branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      approved: ${{ steps.approval.outputs.approved }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out the PR (full history, to compare the branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the pipeline code from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install python modules
        run: pip install -r ci/requirements.txt

      - name: New commits clear "Ready to Deploy" (they need a fresh approval)
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        run: gh pr edit "$PR" --remove-label "$READY_LABEL" || true

      - name: Run the promotion checks (reads Git and the QA org only)
        env:
          IICS_LOGIN_URL: https://dmp-us.informaticacloud.com
          # QA org = DemoCentral. In this repo the UAT_IICS_* secrets hold the DemoCentral login.
          QA_IICS_USERNAME: ${{ secrets.UAT_IICS_USERNAME }}
          QA_IICS_PASSWORD: ${{ secrets.UAT_IICS_PASSWORD }}
        run: |
          python ci/scripts/idmc_promote.py validate --config ci/cicd/config.yml --out out \
            --pr "$PR" --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"

      - name: Post the check result on the PR
        if: always()
        run: |
          [ -f out/plan.md ] || exit 0
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
                 --jq '.[] | select(.body | contains("<!-- idmc-promote:plan -->")) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@out/plan.md > /dev/null
          else
            gh pr comment "$PR" --body-file out/plan.md
          fi

      - name: A failed check also clears "Ready to Deploy"
        if: failure()
        run: gh pr edit "$PR" --remove-label "$READY_LABEL" || true

      - name: Is the PR approved under the branch protection rules?
        id: approval
        run: |
          decision=$(gh pr view "$PR" --json reviewDecision --jq '.reviewDecision')
          echo "Review decision: ${decision:-none (set up branch protection on $PROD_BRANCH)}"
          if [ "$decision" = "APPROVED" ]; then echo "approved=true" >> "$GITHUB_OUTPUT"; else echo "approved=false" >> "$GITHUB_OUTPUT"; fi

  # ------------------------------------------------------------------------------------------------
  # Stage 3 is the human approval: a native PR review. This job only starts when the checks above
  # passed AND GitHub reports the PR as approved (required reviewers / CODEOWNERS satisfied).
  #
  # Stage 4: hand over for manual migration. Exports the package from the QA org (a read), attaches it
  # to this run, tags the approved commit, labels the PR and notifies the developer.
  # Production is not contacted.
  # ------------------------------------------------------------------------------------------------
  prepare-manual-migration:
    name: prepare-manual-migration
    needs: validate-promotion
    if: needs.validate-promotion.outputs.approved == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the promotion tag
      pull-requests: write
      issues: write          # label and comment
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the PR (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the pipeline code from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install python modules
        run: pip install -r ci/requirements.txt

      - name: Name the package and tag
        id: names
        run: |
          short=${HEAD_SHA::7}
          echo "artifact=promotion-pr-$PR-$short" >> "$GITHUB_OUTPUT"
          echo "tag=promotion/pr-$PR-$short" >> "$GITHUB_OUTPUT"

      - name: Build the manual-migration package (export from the QA org)
        env:
          IICS_LOGIN_URL: https://dmp-us.informaticacloud.com
          QA_IICS_USERNAME: ${{ secrets.UAT_IICS_USERNAME }}
          QA_IICS_PASSWORD: ${{ secrets.UAT_IICS_PASSWORD }}
        run: |
          python ci/scripts/idmc_promote.py package --config ci/cicd/config.yml --out package \
            --pr "$PR" --base "${{ github.event.pull_request.base.sha }}" --head "$HEAD_SHA" \
            --tag "${{ steps.names.outputs.tag }}" --author "${{ github.event.pull_request.user.login }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Attach the package to this run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: package/
          retention-days: 90

      - name: Tag the approved commit
        run: |
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/${{ steps.names.outputs.tag }}" -f sha="$HEAD_SHA" > /dev/null \
            || echo "Tag ${{ steps.names.outputs.tag }} already exists"

      - name: Label the PR "Ready to Deploy" and notify the developer
        run: |
          gh label create "$READY_LABEL" --color 0E8A16 \
            --description "Approved and packaged; ready for manual migration to Production" --force
          gh pr edit "$PR" --add-label "$READY_LABEL"
          gh pr comment "$PR" --body-file package/COMMENT.md

name: Auto PR Demo to Dfactory

on:
  push:
    branches:
      - Demo-Central-Branch
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  # "true"  = testing: merge the PR straight away, bypassing the required approval on Dfactory-Branch
  #           (admin bypass with the IICS_REPO token; the branch rule itself stays in place)
  # "false" = normal: auto-merge once someone approves the PR
  SKIP_APPROVAL: "true"

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Demo-Central-Branch
        uses: actions/checkout@v4
        with:
          ref: Demo-Central-Branch

      - name: Create or find pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.IICS_REPO }}
        run: |
          existing_pr=$(gh pr list \
            --base Dfactory-Branch \
            --head Demo-Central-Branch \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$existing_pr" ]; then
            pr_url=$(gh pr create \
              --base Dfactory-Branch \
              --head Demo-Central-Branch \
              --title "Move IICS assets from Demo-Central-Branch to Dfactory-Branch" \
              --body "Auto-created PR for reviewing and approving IICS asset changes from Demo-Central-Branch to Dfactory-Branch.")

            pr_number=$(echo "$pr_url" | grep -o '[0-9]*$')
          else
            pr_number="$existing_pr"
            echo "Pull request already exists: #$pr_number"
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Merge pull request
        env:
          GH_TOKEN: ${{ secrets.IICS_REPO }}
        run: |
          if [ "$SKIP_APPROVAL" = "true" ]; then
            echo "SKIP_APPROVAL=true: merging #${{ steps.pr.outputs.pr_number }} now (admin bypass)"
            gh pr merge ${{ steps.pr.outputs.pr_number }} --merge --admin
          else
            gh pr merge ${{ steps.pr.outputs.pr_number }} --auto --merge
          fi

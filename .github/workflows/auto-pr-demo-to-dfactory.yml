name: Auto PR Demo to Dfactory

on:
  push:
    branches:
      - Demo-Central-Branch
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Demo-Central-Branch
        uses: actions/checkout@v4
        with:
          ref: Demo-Central-Branch

      - name: Create or find pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr=$(gh pr list \
            --base Dfactory-Branch \
            --head Demo-Central-Branch \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$existing_pr" ]; then
            pr_url=$(gh pr create \
              --base Dfactory-Branch \
              --head Demo-Central-Branch \
              --title "Move IICS assets from Demo-Central-Branch to Dfactory-Branch" \
              --body "Auto-created PR for reviewing and approving IICS asset changes from Demo-Central-Branch to Dfactory-Branch.")

            pr_number=$(echo "$pr_url" | grep -o '[0-9]*$')
          else
            pr_number="$existing_pr"
            echo "Pull request already exists: #$pr_number"
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.IICS_REPO }}
        run: |
          gh pr merge ${{ steps.pr.outputs.pr_number }} --auto --merge

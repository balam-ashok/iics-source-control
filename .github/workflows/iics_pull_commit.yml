name: IDMC_PULL_COMMIT

# Pulls a commit from Dfactory-Branch into the Dfactory org (assets not yet pulled via source control)
on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: "Commit hash on Dfactory-Branch to pull (leave blank for the latest commit)"
        type: string
        required: false

env:
  IICS_LOGIN_URL: https://dmp-us.informaticacloud.com
  TARGET_BRANCH: Dfactory-Branch

  # infa_login.py logs in to both orgs
  IICS_USERNAME: ${{ secrets.IICS_USERNAME }}
  IICS_PASSWORD: ${{ secrets.IICS_PASSWORD }}
  UAT_IICS_USERNAME: ${{ secrets.UAT_IICS_USERNAME }}
  UAT_IICS_PASSWORD: ${{ secrets.UAT_IICS_PASSWORD }}

jobs:
  pull_commit:
    name: Pull commit into target org
    environment:
      name: uat
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install python modules
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Resolve commit hash
        env:
          INPUT_COMMIT_HASH: ${{ github.event.inputs.commit_hash }}
        run: |
            if [ -n "${INPUT_COMMIT_HASH}" ]; then
              COMMIT="${INPUT_COMMIT_HASH}"
            else
              COMMIT=$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)
            fi
            if [ -z "${COMMIT}" ]; then
              echo "Could not resolve a commit hash"; exit 1
            fi
            echo "Pulling commit ${COMMIT}"
            echo "UAT_COMMIT_HASH=${COMMIT}" >> "$GITHUB_ENV"

      - name: Login to IDMC
        run: python ./scripts/infa_login.py

      - name: Pull commit into target org
        run: python ./scripts/infa_pull_commit.py

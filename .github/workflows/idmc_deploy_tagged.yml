name: IDMC - Deploy tagged assets

# Deploys to DFactory Inc DEV only the DemoCentral assets tagged ready-to-deploy (cicd-ready-qa) that are
# checked in (not checked out) and whose last check-in is merged into Dfactory-Branch. Everything ready
# goes in one pull; afterwards each asset is re-tagged in DemoCentral: cicd-ready-qa -> cicd-deployed-qa,
# or cicd-failed-qa when its pull failed. Tag names are in cicd/config.yml (tags:).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Only assets that also carry this tag, e.g. rel-20261002 (blank = everything ready)"
        type: string
        required: false
      dry_run:
        description: "Dry run: list what would deploy, change nothing (no tags either)"
        type: boolean
        default: false
      run_tests:
        description: "Run the deployed mapping tasks afterwards"
        type: boolean
        default: true
  # To deploy on a timetable as well, uncomment (UTC; 13:15 UTC = 18:45 IST, Monday to Friday):
  # schedule:
  #   - cron: '15 13 * * 1-5'

# never run at the same time as another deploy or migration
concurrency:
  group: idmc-deploy-dfactory
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy assets tagged ready to Dfactory
    runs-on: ubuntu-latest
    environment:
      name: uat

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install python modules
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Deploy tagged assets
        env:
          IICS_LOGIN_URL: https://dmp-us.informaticacloud.com
          # same mapping as idmc_cicd.yml: the IICS_* secrets log in to DFactory Inc DEV and the
          # UAT_IICS_* secrets to DemoCentral, so they are swapped here
          IICS_USERNAME: ${{ secrets.UAT_IICS_USERNAME }}
          IICS_PASSWORD: ${{ secrets.UAT_IICS_PASSWORD }}
          UAT_IICS_USERNAME: ${{ secrets.IICS_USERNAME }}
          UAT_IICS_PASSWORD: ${{ secrets.IICS_PASSWORD }}
          SECRETS_JSON: ${{ secrets.IDMC_CONNECTION_PASSWORDS }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          RUN_TESTS: ${{ github.event.inputs.run_tests }}
        run: python ./scripts/idmc_deploy_tagged.py

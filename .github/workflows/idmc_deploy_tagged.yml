name: IDMC - Deploy tagged assets

# Deploys to DFactory Inc DEV only the DemoCentral assets tagged ready-to-deploy that are checked in (not
# checked out) and whose last check-in is merged into Dfactory-Branch. Everything ready goes in one pull;
# afterwards each deployed asset is re-tagged in DemoCentral: ready-to-deploy / reviewed / in-review -> deployed.
# An asset whose pull failed keeps ready-to-deploy, so the next run tries it again. Tag names: cicd/config.yml (tags:).
#
# Two steps with an approval in between:
#   1. "Check tagged assets"  - reads the tags and lists what would be migrated. If a tagged asset uses assets that
#                               were never checked in (e.g. a taskflow's mapping task and mapping), it checks them
#                               in from DemoCentral; that check-in starts this workflow again for the full set.
#   2. "Migrate to Dfactory"  - waits for a reviewer to approve (GitHub environment dfactory-approval),
#                               then migrates. Only requested when step 1 found something to migrate.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Only assets that also carry this tag, e.g. rel-20261002 (blank = everything ready)"
        type: string
        required: false
      dry_run:
        description: "Dry run: list what would deploy, change nothing (no tags either)"
        type: boolean
        default: false
      run_tests:
        description: "Also run the deployed mapping tasks in Dfactory afterwards (needs a Secure Agent)"
        type: boolean
        default: false
      show_folder:
        description: "Only show a DemoCentral folder's assets with their id, tags and check-in state, e.g. Project/Folder (no deploy)"
        type: string
        required: false
  # Runs on its own right after each check-in (once the Auto PR has merged it into Dfactory-Branch), checks the
  # tags in DemoCentral and deploys only the assets tagged ready-to-deploy. Tag an asset before checking it in.
  # A check-in with nothing tagged ends in seconds and migrates nothing.
  workflow_run:
    workflows: ["Trigger Dfactory deploy on merge"]
    types: [completed]

env:
  IICS_LOGIN_URL: https://dmp-us.informaticacloud.com
  # same mapping as idmc_cicd.yml: the IICS_* secrets log in to DFactory Inc DEV and the
  # UAT_IICS_* secrets to DemoCentral, so they are swapped here
  IICS_USERNAME: ${{ secrets.UAT_IICS_USERNAME }}
  IICS_PASSWORD: ${{ secrets.UAT_IICS_PASSWORD }}
  UAT_IICS_USERNAME: ${{ secrets.IICS_USERNAME }}
  UAT_IICS_PASSWORD: ${{ secrets.IICS_PASSWORD }}
  SECRETS_JSON: ${{ secrets.IDMC_CONNECTION_PASSWORDS }}
  RELEASE_TAG: ${{ github.event.inputs.release_tag }}

jobs:
  check:
    name: Check tagged assets
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      to_deploy: ${{ steps.check.outputs.to_deploy }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install python modules
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: List the assets tagged ready-to-deploy and check in their dependencies
        id: check
        env:
          DRY_RUN: "true"
          RUN_TESTS: "false"
          # check in never-checked-in dependencies (not in a dry run started by hand)
          AUTO_CHECKIN: ${{ github.event.inputs.dry_run != 'true' }}
          SHOW_FOLDER: ${{ github.event.inputs.show_folder }}
        run: python ./scripts/idmc_deploy_tagged.py

  deploy:
    name: Migrate to Dfactory
    needs: check
    # only when something is tagged ready, and not for a dry run
    if: needs.check.outputs.to_deploy != '' && needs.check.outputs.to_deploy != '0' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    # the approval: add the approvers under Settings > Environments > dfactory-approval > Required reviewers
    environment:
      name: dfactory-approval
    # never run at the same time as another deploy or migration
    concurrency:
      group: idmc-deploy-dfactory
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install python modules
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Migrate tagged assets
        env:
          DRY_RUN: "false"
          AUTO_CHECKIN: "false"
          RUN_TESTS: ${{ github.event.inputs.run_tests }}
        run: python ./scripts/idmc_deploy_tagged.py

name: Trigger Dfactory deploy on merge

# Runs when a PR into Dfactory-Branch is closed. If it was merged, its successful completion
# starts "IDMC CI/CD - Deploy to Dfactory" on main.
on:
  pull_request:
    types: [closed]
    branches: [Dfactory-Branch]

jobs:
  merged:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Merged into Dfactory-Branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          echo "PR ${PR_NUMBER} merged into Dfactory-Branch as ${MERGE_SHA}"

name: IDMC - Refresh migration workbook

# Rebuilds cicd/migration_objects.xlsx from the live orgs: every connection and schedule in DemoCentral
# with its status in DFactory Inc DEV. Read-only against both orgs. Choices already in the workbook
# (Migrate = Y, passwords keys, notes...) are kept. The commit it makes does not start a migration.
on:
  workflow_dispatch:

concurrency:
  group: idmc-deploy-dfactory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh cicd/migration_objects.xlsx
    runs-on: ubuntu-latest
    environment:
      name: uat

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install python modules
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Build the workbook
        env:
          IICS_LOGIN_URL: https://dmp-us.informaticacloud.com
          # same mapping as idmc_cicd.yml: the IICS_* secrets log in to DFactory Inc DEV and the
          # UAT_IICS_* secrets to DemoCentral, so they are swapped here
          IICS_USERNAME: ${{ secrets.UAT_IICS_USERNAME }}
          IICS_PASSWORD: ${{ secrets.UAT_IICS_PASSWORD }}
          UAT_IICS_USERNAME: ${{ secrets.IICS_USERNAME }}
          UAT_IICS_PASSWORD: ${{ secrets.IICS_PASSWORD }}
        run: python ./scripts/idmc_migration_workbook.py

      - name: Commit the workbook
        run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cicd/migration_objects.xlsx
            if git diff --cached --quiet; then
              echo "Workbook unchanged"
            else
              git commit -m "Refresh migration workbook from DemoCentral and DFactory"
              git push origin HEAD:main
            fi

      - name: Attach the workbook
        uses: actions/upload-artifact@v4
        with:
          name: migration-objects
          path: cicd/migration_objects.xlsx

# Settings for .github/workflows/idmc-promote.yml (scripts/idmc_promote.py).
# The workflow reads Git and the QA org only. It never contacts the Production org: Production is
# migrated by hand from the package the workflow prepares after approval.

branches:
  qa: Demo-Central-Branch          # where IDMC checks in (QA org: DemoCentral)
  production: Dfactory-Branch      # what Production is migrated to (Production org: DFactory Inc DEV)

# safety check: the QA login must reach this org (blank = don't check)
orgs:
  qa: "DemoCentral"

labels:
  ready: Ready to Deploy           # set after approval, once the package is attached

# GitHub users or teams mentioned when a promotion is ready for manual migration (the PR author is
# always mentioned), for example: [balam-ashok, my-org/idmc-developers]
notify: []

validation:
  # how many levels of "uses" to follow when checking that dependencies are checked in
  max_depth: 5
  # an asset whose type contains one of these words may not be in a promotion package
  # (connections and schedules are set up in Production by hand)
  blocked_type_words: [CONNECTION, SCHEDULE]
  # dependencies of these kinds are never in Git; the check lists them as "must already exist in Production"
  environment_type_words: [CONNECTION, SCHEDULE, RUNTIME, AGENT]

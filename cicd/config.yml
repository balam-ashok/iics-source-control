# IDMC CI/CD settings, read by scripts/idmc_cicd.py
# Demo org checks in to source_branch; the Auto PR merges it into target_branch; the pipeline deploys
# target_branch to the Dfactory org.

source_branch: Demo-Central-Branch
target_branch: Dfactory-Branch

# true = discover and report only; nothing is created, pulled, published or run
dry_run: false

# accept mapping tasks that complete with errors and pulls that end in WARNING
allow_warnings: false

connections:
  # find the connections used by the changed assets and create any that are missing in Dfactory
  sync: true
  # connections to check on every run, even if no changed asset uses them
  always_include: []
  # overwrite existing Dfactory connections whose definition differs from Demo (off: only report the drift)
  update_existing: false
  # per-connection settings (connection name as in Demo):
  #   password_secret: key in the IDMC_CONNECTION_PASSWORDS GitHub secret (a JSON object of
  #                    {"key": "Dfactory password"}) holding this connection's password
  #   overrides:       Dfactory-specific values applied after create/update (host, database, username, ...)
  #   test:            run the connection test afterwards (default true)
  settings: {}
  # example:
  #   Oracle_Sales:
  #     password_secret: Oracle_Sales
  #     overrides:
  #       host: oracle-dfactory.internal
  #       database: SALESUAT

# Demo name -> Dfactory name, only where they differ (used for the import and the pull)
connection_map: {}
runtime_environment_map: {}

dependencies:
  # bring over objects the changed assets use (mappings, mapplets, schemas...) that are missing in Dfactory:
  # pulled from Git when they were checked in earlier, otherwise exported from Demo and imported
  sync: true
  import_from_demo: true
  # how many levels of "uses" to follow
  max_depth: 5
  # The tagged deploy (IDMC - Deploy tagged assets) also uses this: with sync: true a ready asset that uses an
  # object nobody tagged still deploys (that object comes along at its merged version); with sync: false
  # strictly only the tagged assets go and such an asset fails with the missing dependency named.

# IDMC tags that drive "IDMC - Deploy tagged assets" (set them in DemoCentral on checked-in assets):
#   in_review: checked in, waiting for review (never deployed)
#   ready:     approved; the next tagged deploy takes it if its last check-in is merged into Dfactory-Branch
#   deployed:  set by the deploy after a successful pull (replaces ready / failed / in_review)
#   failed:    set by the deploy when the asset's pull failed (replaces ready); fix, check in, re-tag ready
#   hold:      never deployed, even when also tagged ready
tags:
  in_review: cicd-in-review
  ready: cicd-ready-qa
  deployed: cicd-deployed-qa
  failed: cicd-failed-qa
  hold: cicd-hold

schedules:
  # create the schedules used by changed mapping tasks if Dfactory lacks them, and re-link after the pull
  sync: true

publish:
  # publish changed taskflows, processes, guides, App Connections and service connectors after the pull
  enabled: true

tests:
  # run the changed mapping tasks in Dfactory after the pull
  enabled: true
  timeout_seconds: 3600
  poll_seconds: 30

pull_timeout_seconds: 1800

# safety check: the IDMC org names the two logins must reach (blank = don't check); the run stops
# before changing anything if they don't match
orgs:
  source: "DemoCentral"         # Demo org (IICS_USERNAME / IICS_PASSWORD)
  target: "DFactory Inc DEV"    # Dfactory org (UAT_IICS_USERNAME / UAT_IICS_PASSWORD)
